<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Make Silver Week 〜9連休ブロック崩し〜</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game" aria-label="9連休ブロック崩し"></canvas>
      <section id="overlay" class="overlay" aria-live="polite">
        <div class="panel">
          <p class="eyebrow">2026年9月・シルバーウィーク</p>
          <h1 class="title-logo">Make Silver Week<br /><span class="game-subtitle">〜9連休ブロック崩し〜</span></h1>
          <p class="intro">ボールで日付を反転。<br />黒い平日を休日へ変えよう。</p>
          <p class="rule">赤・青に当てると、平日に戻るので注意！</p>
          <button id="startButton" type="button">ゲームをはじめる</button>
          <p class="hint">パドルを左右に動かしてボールを跳ね返そう</p>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
